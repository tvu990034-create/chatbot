  #             capabilities: [gpu]
  #   networks:
  #     - chatbot-net

# ─────────────────────────────────────────────
volumes:
  chromadb-data:
  ollama-models:
  # huggingface-cache:   # uncomment when using vLLM or SGLang

networks:
  chatbot-net:
    driver: bridge
