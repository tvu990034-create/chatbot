name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # Import surface the suite needs (all network/model calls are
        # mocked in tests; heavy GPU/RAG backends stay lazy imports, and
        # tests requiring them skip when absent).
        # NOTE: langgraph, python-multipart and datasets were missing from
        # the first version of this list and failed 55 tests in CI — this
        # list is load-bearing; extend it when new top-level imports land.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.23.0" \
            "typer>=0.12.0" \
            "rich>=13.7.0" \
            "pydantic>=2.7.0" \
            "pydantic-settings>=2.3.0" \
            "numpy" \
            "litellm>=1.94.0" \
            "langgraph>=0.2.0" \
            "fastapi>=0.115.0" \
            "python-multipart>=0.0.9" \
            "httpx>=0.27.0" \
            "requests" \
            "datasets" \
            "langchain-core>=0.3.0"

      - name: Run test suite
        run: python -m pytest tests -q
